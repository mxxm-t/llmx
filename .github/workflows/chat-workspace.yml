name: Chat workspace

on:
  push:
    branches: [main, 'ci/chat-workspace-*']
    paths:
      - 'tools/chat_ui/**'
      - 'tools/health_dashboard/**'
      - '.github/workflows/chat-workspace.yml'
  pull_request:
    paths:
      - 'tools/chat_ui/**'
      - 'tools/health_dashboard/**'
      - '.github/workflows/chat-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      LLMX_CHAT_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Compile Python
        run: python -X utf8 -m compileall -q tools/chat_ui tools/health_dashboard
      - name: Workspace and browser tests
        run: python -X utf8 -m unittest discover -s tools/chat_ui -v
      - name: Existing dashboard tests
        run: python -X utf8 -m unittest discover -s tools/health_dashboard -v
