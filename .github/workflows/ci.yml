name: CI

on:
  push:
    # A stack pushed as gate/<name> runs the whole workflow before it merges; main runs it as the record of each merge.
    branches: [main, 'gate/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run; every other run has a group of its own, so each push to main keeps its run as the record of that merge and each push to a gate branch keeps its run as the check before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    name: CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable: build/llmx
          - os: windows-2022
            executable: build/Release/llmx.exe
          - os: macos-15-intel
            executable: build/llmx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # A tool broken by a change to the CLI or to tests/ fails here rather than when it is next run by hand.
      - name: Python byte-compile and tool help
        if: runner.os == 'Linux'
        run: |
          python -X utf8 -m compileall -q tests tools
          for tool in tools/*.py; do
            echo "$tool --help"
            python -X utf8 "$tool" --help > /dev/null
          done
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
      # The suite needs only the standard library, and with numpy raw-blocks also holds the spec decoders' numpy form to the pure form.
      # That form makes the file-exact references and the MXFP4 fixture, so --require-tools fails raw-blocks without numpy.
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      - name: Test
        run: python -X utf8 tests/run_tests.py --exe "${{ matrix.executable }}" --no-perf-floor --require-tools
      # build.bat builds llmx.exe alone, without the tools beside it, so this run lets the split component skip.
      - name: Plain build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call .\build.bat || exit /b 1
          .\llmx.exe --version > "%RUNNER_TEMP%\plain-version.txt" || exit /b 1
          build\Release\llmx.exe --version > "%RUNNER_TEMP%\cmake-version.txt" || exit /b 1
          type "%RUNNER_TEMP%\plain-version.txt"
          fc "%RUNNER_TEMP%\plain-version.txt" "%RUNNER_TEMP%\cmake-version.txt" || exit /b 1
          python -X utf8 tests/run_tests.py --exe llmx.exe --no-perf-floor

  sanitizer:
    name: CPU (Linux UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure with undefined-behavior checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      - name: Test
        run: python -X utf8 tests/run_tests.py --exe build/llmx --no-perf-floor --require-tools

  vulkan-build:
    name: Vulkan backend (build, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The distribution's compiler is older than the shader extensions the kernels use; the LunarG repository carries a current one.
      - name: Vulkan headers and shader compiler
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/lunarg.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shaderc vulkan-headers
      - name: Configure with the Vulkan backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLMX_HAS_BACKEND_VULKAN=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      # The build Linux GPU users make, on its CPU path: the runner has no device, so the Vulkan commands the suite tries are refused.
      - name: Test on the CPU
        run: python -X utf8 tests/run_tests.py --exe build/llmx --no-perf-floor --require-tools --device cpu

  hf-reference:
    name: HF reference (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      # The key hashes the pins of the models the fetch below downloads, the gate's, so it changes when a download does and not when a check, a bound or a model pinned ahead of the gate does.
      - name: HF fixtures key
        id: hf-key
        run: |
          key=$(python -X utf8 tools/fetch_test_models.py --key)
          echo "key=hf-fixtures-v1-${{ runner.os }}-$key" >> "$GITHUB_OUTPUT"
      - name: Restore HF fixtures
        id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.hf-key.outputs.key }}
      - name: Fetch pinned HF fixtures
        run: python -X utf8 tools/fetch_test_models.py
      # Saved as soon as every download is verified, so a run that fails later still keeps them.
      - name: Save HF fixtures
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      - name: Test with required HF fixtures
        run: python -X utf8 tests/run_tests.py --exe build/llmx --no-perf-floor --require-tools --require-baseline
      - name: HF gate with f32 caches
        run: python -X utf8 tests/run_tests.py --exe build/llmx --require-baseline --cache-type f32 --only baseline
      - name: Q8_0 fixture path and perplexity excerpt
        run: |
          python -X utf8 - >> "$GITHUB_ENV" <<'EOF'
          import json, os, sys
          sys.path.insert(0, "tests")
          import baseline
          excerpt = os.path.join(os.environ["RUNNER_TEMP"], "excerpt.txt")
          with open("tests/data/baseline_perplexity.json", encoding="utf-8") as f:
              text = json.load(f)["text"]
          with open(excerpt, "w", encoding="utf-8", newline="") as f:
              f.write(text)
          print("Q8_0_MODEL=" + baseline.find_fixture(baseline.BASELINE_MODELS[0]))
          print("EXCERPT=" + excerpt)
          EOF
      - name: Layer split over two CPU backends
        run: build/llmx-split-check "$Q8_0_MODEL" "$EXCERPT" cpu cpu,cpu 8 64
      - name: Many users through the server
        run: python -X utf8 tools/server_mix_check.py --exe build/llmx --model "$Q8_0_MODEL" --text tests/data/wiki.test.raw --requests 8 --cli 2
