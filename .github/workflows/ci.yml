name: CI

on:
  push:
    branches: [main, 'gate/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run; every other run has a group of its own, so each push to main keeps its run as the record of that merge and each push to a gate branch keeps its run as the check before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Check main push scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      companion: ${{ steps.paths.outputs.companion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed paths
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || echo "Base unavailable. Running native CI."
          fi
          python3 .github/ci_scope.py "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"
      - name: Build the CLI for documentation checks
        if: steps.paths.outputs.companion == 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target llmx --parallel 4
      - name: Docs and dead code
        if: steps.paths.outputs.companion == 'true'
        run: python3 -X utf8 tests/run_tests.py --annotate --exe build/llmx --only docs,dead-code

  cpu:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.companion != 'true' }}
    name: CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 120 || matrix.os == 'windows-2022' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable: build/llmx
          - os: windows-2022
            executable: build/Release/llmx.exe
          - os: macos-15-intel
            executable: build/llmx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # A tool broken by a change to the CLI or to tests/ fails here rather than when it is next run by hand.
      - name: Python byte-compile and tool help
        if: runner.os == 'Linux'
        run: |
          python -X utf8 -m compileall -q tests tools
          for tool in tools/*.py; do
            echo "$tool --help"
            python -X utf8 "$tool" --help > /dev/null
          done
          python -X utf8 tests/test_ci_annotations.py
          python -X utf8 .github/test_ci_scope.py
      - name: Health dashboard tests
        run: python -X utf8 -m unittest discover -s tools/health_dashboard -v
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Backend tests
        id: ctest
        run: ctest --test-dir build -C Release --output-on-failure
      # The failed tests' names as an annotation, which the public check-runs API shows without a login (docs/CI.md, Reading a failed job without a login).
      - name: Failed tests as annotations
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        continue-on-error: true
        run: python -X utf8 tools/ci_annotations.py build --outcome "${{ steps.ctest.outcome }}"
      # The suite needs only the standard library, and with numpy raw-blocks also holds the spec decoders' numpy form to the pure form.
      # That form makes the file-exact references and the MXFP4 fixture, so --require-tools fails raw-blocks without numpy.
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      - name: Test
        run: python -X utf8 tests/run_tests.py --annotate --exe "${{ matrix.executable }}" --no-perf-floor --require-tools
      # build.bat builds llmx.exe alone, without the tools beside it, so this run lets the split component skip.
      - name: Plain build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call .\build.bat || exit /b 1
          .\llmx.exe --version > "%RUNNER_TEMP%\plain-version.txt" || exit /b 1
          build\Release\llmx.exe --version > "%RUNNER_TEMP%\cmake-version.txt" || exit /b 1
          type "%RUNNER_TEMP%\plain-version.txt"
          fc "%RUNNER_TEMP%\plain-version.txt" "%RUNNER_TEMP%\cmake-version.txt" || exit /b 1
          python -X utf8 tests/run_tests.py --annotate --exe llmx.exe --no-perf-floor

  sanitizer:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.companion != 'true' }}
    name: CPU (Linux UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      # GCC 14, the compiler of docker/Dockerfile's image, beside the runner's default GCC 13 in the ubuntu job.
      - name: Configure with undefined-behavior checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Backend tests
        id: ctest
        run: ctest --test-dir build -C Release --output-on-failure
      # The failed tests' names as an annotation, which the public check-runs API shows without a login (docs/CI.md, Reading a failed job without a login).
      - name: Failed tests as annotations
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        continue-on-error: true
        run: python -X utf8 tools/ci_annotations.py build --outcome "${{ steps.ctest.outcome }}"
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      - name: Test
        run: python -X utf8 tests/run_tests.py --annotate --exe build/llmx --no-perf-floor --require-tools

  thread-sanitizer:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.companion != 'true' }}
    name: CPU (Linux TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests whose threads share the server's objects: the HTTP layer's listener closed from another thread, the scheduler's passes in flight over CPU stages, and the drafter's chains beside other stages' recording on one device.
      - name: Configure with thread checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 "-DCMAKE_CXX_FLAGS=-fsanitize=thread -g"
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target llmx-http-test llmx-server-passes-cpu-test llmx-server-spec-test
      # ThreadSanitizer's memory layout needs address randomization off on the runner's kernel, and a report fails its test with exit status 66.
      # The binaries run without CTest, whose timeouts are set for uninstrumented builds.
      - name: Thread tests
        run: |
          setarch "$(uname -m)" -R build/llmx-http-test
          setarch "$(uname -m)" -R build/llmx-server-passes-cpu-test
          setarch "$(uname -m)" -R build/llmx-server-spec-test --flash-only

  vulkan-build:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.companion != 'true' }}
    name: Vulkan backend (build, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The distribution's compiler is older than the shader extensions the kernels use; the LunarG repository carries a current one.
      - name: Vulkan headers and shader compiler
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/lunarg.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shaderc vulkan-headers
      - name: Configure with the Vulkan backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLMX_HAS_BACKEND_VULKAN=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Backend tests
        id: ctest
        run: ctest --test-dir build -C Release --output-on-failure
      # The failed tests' names as an annotation, which the public check-runs API shows without a login (docs/CI.md, Reading a failed job without a login).
      - name: Failed tests as annotations
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        continue-on-error: true
        run: python -X utf8 tools/ci_annotations.py build --outcome "${{ steps.ctest.outcome }}"
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      # The build Linux GPU users make, on its CPU path: the runner has no device, so the Vulkan commands the suite tries are refused.
      - name: Test on the CPU
        run: python -X utf8 tests/run_tests.py --annotate --exe build/llmx --no-perf-floor --require-tools --device cpu
      # Every target built again at -O0 with every inline function emitted, so the functions only tests keep show (AGENTS.md, Dead code and stale docs).
      # It builds a tree of its own, so it runs whatever the steps before it gave, and a run reports its findings beside theirs.
      - name: Dead code in the linked binaries
        if: ${{ !cancelled() }}
        run: python -X utf8 tests/dead_code.py --linked build-linked

  # The ROCm backend compiled, its tests not run: no hosted runner has a ROCm device, so its device checks are the hand check on an MI50 (docs/STATUS.md).
  rocm-build:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.companion != 'true' }}
    name: ROCm backend (build only, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The SDK from AMD's repository at the release the backend is built and checked with, its headers and the compiler that writes the code objects.
      - name: ROCm headers and compiler
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/rocm.asc https://repo.radeon.com/rocm/rocm.gpg.key
          echo "deb [arch=amd64] https://repo.radeon.com/rocm/apt/7.2.1 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # The distribution packages an older HIP under the same names, so AMD's repository is preferred for every package it has.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hip-dev rocm-device-libs
      - name: Configure with the ROCm backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLMX_HAS_BACKEND_ROCM=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Dead code and docs over the ROCm build
        run: python -X utf8 tests/run_tests.py --annotate --exe build/llmx --only docs,dead-code

  hf-reference:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.companion != 'true' }}
    name: HF reference (CPU)
    runs-on: ubuntu-24.04
    # See docs/CI.md for observed durations and job-budget rationale.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      # The key hashes the pins of the models the fetch below downloads, the gate's, so it changes when a download does and not when a check, a bound or a model pinned ahead of the gate does.
      - name: HF fixtures key
        id: hf-key
        run: |
          key=$(python -X utf8 tools/fetch_test_models.py --key)
          echo "key=hf-fixtures-v1-${{ runner.os }}-$key" >> "$GITHUB_OUTPUT"
      - name: Restore HF fixtures
        id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.hf-key.outputs.key }}
      - name: Fetch pinned HF fixtures
        run: python -X utf8 tools/fetch_test_models.py
      # Saved as soon as every download is verified, so a run that fails later still keeps them.
      - name: Save HF fixtures
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
      - name: Numpy for the spec decoders
        run: python -m pip install --only-binary=numpy numpy==2.4.3
      - name: Test with required HF fixtures
        run: python -X utf8 tests/run_tests.py --annotate --exe build/llmx --no-perf-floor --require-tools --require-baseline
      - name: HF gate with f32 caches
        run: python -X utf8 tests/run_tests.py --annotate --exe build/llmx --require-baseline --cache-type f32 --only baseline
      - name: Q8_0 fixture path and perplexity excerpt
        run: |
          python -X utf8 - >> "$GITHUB_ENV" <<'EOF'
          import json, os, sys
          sys.path.insert(0, "tests")
          import baseline
          excerpt = os.path.join(os.environ["RUNNER_TEMP"], "excerpt.txt")
          with open("tests/data/baseline_perplexity.json", encoding="utf-8") as f:
              text = json.load(f)["text"]
          with open(excerpt, "w", encoding="utf-8", newline="") as f:
              f.write(text)
          print("Q8_0_MODEL=" + baseline.find_fixture(baseline.BASELINE_MODELS[0]))
          print("EXCERPT=" + excerpt)
          EOF
      - name: Layer split over two CPU backends
        run: build/llmx-split-check "$Q8_0_MODEL" "$EXCERPT" cpu cpu,cpu 8 64
      - name: Many users through the server
        run: python -X utf8 tools/server_mix_check.py --exe build/llmx --model "$Q8_0_MODEL" --text tests/data/wiki.test.raw --requests 8 --cli 2
