name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable: build/llmx
          - os: windows-2022
            executable: build/Release/llmx.exe
          - os: macos-15-intel
            executable: build/llmx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test
        run: python -X utf8 tests/run_tests.py --exe "${{ matrix.executable }}" --no-perf-floor
      - name: Plain build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call .\build.bat || exit /b 1
          .\llmx.exe --version > "%RUNNER_TEMP%\plain-version.txt" || exit /b 1
          build\Release\llmx.exe --version > "%RUNNER_TEMP%\cmake-version.txt" || exit /b 1
          type "%RUNNER_TEMP%\plain-version.txt"
          fc "%RUNNER_TEMP%\plain-version.txt" "%RUNNER_TEMP%\cmake-version.txt" || exit /b 1
          python -X utf8 tests/run_tests.py --exe llmx.exe --no-perf-floor

  sanitizer:
    name: CPU (Linux UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure with undefined-behavior checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test
        run: python -X utf8 tests/run_tests.py --exe build/llmx --no-perf-floor

  vulkan-build:
    name: Vulkan backend (build, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The distribution's compiler is older than the shader extensions the
      # kernels use; the LunarG repository carries a current one.
      - name: Vulkan headers and shader compiler
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/lunarg.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shaderc vulkan-headers
      - name: Configure with the Vulkan backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLMX_HAS_BACKEND_VULKAN=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
  hf-reference:
    name: HF reference (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test fixture downloader
        run: python -X utf8 tests/fetch_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Backend tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Cache HF fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/baseline.py') }}
      - name: Fetch pinned HF fixtures
        run: python -X utf8 tools/fetch_test_models.py
      - name: Test with required HF fixtures
        run: python -X utf8 tests/run_tests.py --exe build/llmx --no-perf-floor --require-baseline
