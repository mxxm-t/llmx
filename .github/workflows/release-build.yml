name: Release build

# The downloads, untagged images and signed checksums of a version release or a nightly build, called by release.yml and nightly.yml (docs/RELEASE.md).
# It leaves every file in the artifact `release` for its caller to publish.
on:
  workflow_call:
    inputs:
      name:
        description: The release, X.Y.Z, or nightly; it names the archives and the image tags.
        type: string
        required: true
      push:
        description: Push the images by digest and sign them; without it the images are only built.
        type: boolean
        required: true
    outputs:
      version:
        description: X.Y.Z for a release, the build identifier for a nightly build.
        value: ${{ jobs.linux.outputs.version }}
      refs:
        description: The pushed images as TARGET=sha256:DIGEST, bare digests that no secret's value can mask.
        value: ${{ jobs.images.outputs.refs }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 tarball
    runs-on: ubuntu-24.04
    # Not yet timed on a hosted runner (docs/RELEASE.md); twice the estimate until the first tag run gives a figure.
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build script checks that the binary needs only the C library and opens the Vulkan loader and the HIP runtime itself.
      - name: Build in Ubuntu 22.04
        env:
          CHANNEL: ${{ inputs.name == 'nightly' && 'nightly' || '' }}
        run: docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 bash docker/release/build-linux.sh $CHANNEL
      # A machine with neither a Vulkan loader nor ROCm still runs the binary on the CPU.
      - name: Run in a plain container
        id: version
        run: |
          out=$(docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -c \
            'tar -xzf /dist/llmx-${{ inputs.name }}-linux-x86_64.tar.gz -C /tmp && /tmp/llmx-*/llmx --version')
          echo "$out"
          if [ "${{ inputs.name }}" = nightly ]; then version=$(echo "$out" | cut -d' ' -f2); else version="${{ inputs.name }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/llmx-${{ inputs.name }}-linux-x86_64.tar.gz
          if-no-files-found: error

  # Two zips from one recipe: CPU and Vulkan, and the same with the ROCm backend for AMD's Windows HIP runtimes, which ships no AMD DLL (docs/RELEASE.md).
  windows:
    name: Windows x64 zip${{ matrix.suffix }}
    runs-on: windows-2022
    # The ROCm zip's kernels compile one target after another, over two hours on the full Windows list (docs/BUILD.md, The ROCm backend on Windows).
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - suffix: ''
            rocm: 'OFF'
          - suffix: '-rocm'
            rocm: 'ON'
    env:
      VULKAN_SDK_VERSION: 1.4.335.0
    steps:
      # The archives ship the files as the commit holds them, so the zip's companion is the tarball's, and companion.sh runs under bash.
      - name: Check out without CRLF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK supplies the headers and glslc at build time only; at run time llmx opens the vulkan-1.dll the GPU driver installs.
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $installer
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install | Out-Null
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "glslc.exe missing under $root" }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # TheRock's SDK wheels at a pinned release supply the HIP headers and the ROCm clang at build time only (docs/BUILD.md, The ROCm backend on Windows).
      - name: ROCm headers and compiler
        if: matrix.rocm == 'ON'
        shell: pwsh
        run: |
          python -m venv C:\TheRock
          C:\TheRock\Scripts\python -m pip install --quiet --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[devel]==10.0.0"
          C:/TheRock/Scripts/rocm-sdk init
          $root = (C:/TheRock/Scripts/rocm-sdk path --root).Trim()
          "HIP_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DLLMX_HAS_BACKEND_VULKAN=ON -DLLMX_HAS_BACKEND_ROCM=${{ matrix.rocm }} -DLLMX_NIGHTLY=${{ inputs.name == 'nightly' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Companion files
        shell: bash
        run: bash docker/release/companion.sh "dist/llmx-${{ inputs.name }}-windows-x64${{ matrix.suffix }}"
      - name: Package
        shell: pwsh
        run: |
          $name = "${{ inputs.name }}"
          $release = (Select-String -Path CMakeLists.txt -Pattern '^project\(llmx VERSION ([0-9.]+) ').Matches[0].Groups[1].Value
          $channel = if ($name -eq "nightly") { "nightly\.[0-9]{8}\." } else { "" }
          $out = (& build\Release\llmx.exe --version)
          $out
          if ($out -notmatch "^llmx $([regex]::Escape($release))\+$($channel)g[0-9a-f]{12,} ") { throw "the build identifier lacks the release or the commit, or the tree is dirty" }
          $dir = "llmx-$name-windows-x64${{ matrix.suffix }}"
          Copy-Item build\Release\llmx.exe, README.md "dist\$dir\"
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md "dist\$dir\"
          Compress-Archive -Path "dist\$dir" -DestinationPath "dist\$dir.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows${{ matrix.suffix }}
          path: dist/llmx-${{ inputs.name }}-windows-x64${{ matrix.suffix }}.zip
          if-no-files-found: error

  images:
    name: Docker images
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      refs: ${{ steps.push.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      - name: Log in to GHCR
        if: inputs.push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The images go to GHCR by digest alone and signed; the caller tags them once it publishes (docker/release/images.sh).
      - id: push
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ needs.linux.outputs.version }}
          PUSH: ${{ inputs.push && 'push' || '' }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir context
          tar -xzf "dist/llmx-$NAME-linux-x86_64.tar.gz" -C context --strip-components=1
          bash docker/release/images.sh build "$VERSION" context $PUSH > refs.txt
          refs=$(tr '\n' ' ' < refs.txt)
          echo "$refs"
          echo "refs=${refs% }" >> "$GITHUB_OUTPUT"

  checksums:
    name: Signed checksums
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{linux,windows,windows-rocm}'
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum llmx-* > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "::warning::MINISIGN_SECRET_KEY is not set, SHA256SUMS is not signed"; exit 0; fi
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -t "llmx ${{ needs.linux.outputs.version }}"
          rm -f "$RUNNER_TEMP/minisign.key"
      # The public halves of the owner's keys are repository variables, attached so a user verifies with the files of the release itself.
      - name: Public keys
        working-directory: dist
        env:
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          if [ -n "$MINISIGN_PUBLIC_KEY" ]; then printf '%s\n' "$MINISIGN_PUBLIC_KEY" > llmx.pub; else echo "::warning::MINISIGN_PUBLIC_KEY is not set, llmx.pub is not attached"; fi
          if [ -n "$COSIGN_PUBLIC_KEY" ]; then printf '%s\n' "$COSIGN_PUBLIC_KEY" > cosign.pub; else echo "::warning::COSIGN_PUBLIC_KEY is not set, cosign.pub is not attached"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
