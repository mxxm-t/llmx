name: Release

# A tag vX.Y.Z on a gated main commit builds the release as a draft; the owner publishes it after the device smoke runs (docs/RELEASE.md).
# Publishing it adds the floating image tags and the Docker Hub mirror.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the release version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # CMake's project version and the fallback config of build.bat move together (AGENTS.md, Checkpoints), and the tag names that version.
      # A tag on a commit main does not hold builds no draft, and neither does a version CHANGELOG.md has no notes for.
      - id: v
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -n 's/^project(llmx VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          config_version=$(sed -n 's/^#define LLMX_RELEASE_VERSION "\(.*\)"/\1/p' src/config.hpp)
          echo "tag $tag, CMakeLists.txt $cmake_version, src/config.hpp $config_version"
          [ "$tag" = "$cmake_version" ] && [ "$tag" = "$config_version" ] || exit 1
          python3 tools/release_notes.py "$tag" > /dev/null
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-build.yml
    with:
      name: ${{ needs.version.outputs.version }}
      push: true
    secrets: inherit

  draft:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # Only the versioned tags while the release is a draft; the floating tags follow when it is published.
      - name: Tag the images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFS: ${{ needs.build.outputs.refs }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash docker/release/images.sh tag "${{ needs.version.outputs.version }}" $REFS
      # The notes open with the version's section of CHANGELOG.md, and the step fails without one.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            python3 tools/release_notes.py "$version"
            echo
            echo "Downloads: the Linux x86_64 tarball (CPU, Vulkan and ROCm in one binary), the Windows x64 zip (CPU and Vulkan), both with the chat companion and the health dashboard, and SHA256SUMS."
            echo
            echo "Images: \`$image:$version-vulkan\`, \`$image:$version-rocm7\` and the chat companion's \`$image:chat-$version\`."
            echo
            echo "Pinned digests: ${{ needs.build.outputs.refs }}"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "llmx $version" --notes-file notes.md dist/*

  publish:
    name: Floating tags and mirror
    # A nightly pre-release (nightly.yml) is published by the workflow's own token, which starts no run, and its tag is not a version.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The published release's versioned images gain the floating tags, and Docker Hub mirrors both, copied by digest so every name holds the same bytes.
      - name: Tag and mirror
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash docker/release/images.sh tag "${GITHUB_REF_NAME#v}" hub floating tags
